# Clef (huggingface.co/Cloudflare/clef): 27B joint-schema-head decision model, ~55 GB bf16.
# Served by scripts/serve_clef.py --repo Cloudflare/clef --port 8101 (Framework iGPU, 96 GiB VRAM),
# or point url at an SGLang server (model card cookbook).
kind: systemone-http
name: clef
url: http://127.0.0.1:8101
model: clef
key_env: CLEF_API_KEY
timeout_s: 60
