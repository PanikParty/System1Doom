[project]
name = "s1doom"
version = "0.1.0"
description = "System One models (Jev, Laya) play DOOM via ViZDoom"
authors = [
    { name = "amvox2", email = "swalmen.angelino@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28.1",
    "numpy>=2.4.6",
    "omgifol>=0.5.1",
    "opencv-python>=5.0.0.93",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "typer>=0.27.2",
    "vizdoom>=1.3.1",
]

[project.optional-dependencies]
laya = [
    "laya[serve]>=0.3.21",
]

[build-system]
requires = ["uv_build>=0.11.9,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[project.scripts]
s1doom = "s1doom.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: calls a real Jev/Laya endpoint (skipped by default; run with -m live)",
           "engine: boots ViZDoom (slower)"]
addopts = "-m 'not live'"
asyncio_mode = "auto"
